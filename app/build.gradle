plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.m8.trafficwarn'
    compileSdk 34

    defaultConfig {
        applicationId "com.m8.trafficwarn"
        minSdk 21
        targetSdk 29 // Tối ưu chuẩn cho LineageOS 17.1 (Android 10)
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
